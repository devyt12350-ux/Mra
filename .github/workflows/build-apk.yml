name: Build and Release Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify active Java version
        run: java -version

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK Actions Artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        id: create_release
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: v${{ github.run_number }}.${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          RELEASE_ASSET="app-debug-${TAG_NAME}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$RELEASE_ASSET"
          gh release create "$TAG_NAME" "$RELEASE_ASSET" \
            --target "$COMMIT_SHA" \
            --title "Release ${TAG_NAME}" \
            --notes "Automated debug APK build from commit ${COMMIT_SHA} (Run #${{ github.run_number }}, Attempt #${{ github.run_attempt }})." \
            --latest

      - name: Generate Workflow Summary
        if: always()
        run: |
          TAG_NAME="v${{ github.run_number }}.${{ github.run_attempt }}"
          RELEASE_STATUS="${{ steps.create_release.outcome }}"

          echo "## Build and Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **AGP Version**: 9.1.1" >> $GITHUB_STEP_SUMMARY
          echo "- **Java Version**: 17" >> $GITHUB_STEP_SUMMARY
          echo "- **Gradle Version**: 9.3.1" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Command**: \`gradle :app:assembleDebug --stacktrace --no-daemon\`" >> $GITHUB_STEP_SUMMARY
          echo "- **APK Path**: \`app/build/outputs/apk/debug/app-debug.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Actions Artifact Name**: \`app-debug-apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Tag**: \`${TAG_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Asset**: \`app-debug-${TAG_NAME}.apk\`" >> $GITHUB_STEP_SUMMARY

          if [ "$RELEASE_STATUS" = "success" ]; then
            echo "- **Release Status**: Succeeded (Latest release published with standalone APK)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Release Status**: Failed or Skipped (Actions artifact 'app-debug-apk' remains accessible)" >> $GITHUB_STEP_SUMMARY
          fi
